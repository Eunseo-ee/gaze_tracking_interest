spring.application.name=gaze-tracking-interest

# static css cashing ignore
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.web.resources.static-locations=classpath:/static/,classpath:/static/uploads/

# ========== DATABASE ==========
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/gaze_demo}

# ========== FASTAPI SERVER 연결 ==========
# FastAPI 서버의 Render 주소
fastapi.server.url=https://fastapi-gaze.onrender.com

# ========== GOOGLE DRIVE ==========
# Render Secret 파일로 credentials.json은 관리하므로, 실제 경로만 지정해둬도 됨
gdrive.credentials.path=/etc/secrets/credentials.json
gdrive.tokens.path=/etc/secrets/drive_token.json

# ========== LOGGING (선택적: 로그 레벨 낮추기) ==========
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot.autoconfigure=ERROR

# ===== 데이터 소스 =====
# local: sample-data/ 폴더의 샘플 파일 사용 (기본값) / drive: Google Drive 사용
app.data-source=${APP_DATA_SOURCE:local}
app.local.data-dir=${APP_LOCAL_DATA_DIR:sample-data}
# drive 모드에서 사용할 Drive 폴더 ID (환경변수로 지정)
app.drive.folder-id=${DRIVE_FOLDER_ID:}
